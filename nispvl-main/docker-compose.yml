services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      CONTENT_DIR: /content
    volumes:
      - ./data:/data
      - ./content:/content:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

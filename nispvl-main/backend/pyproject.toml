[project]
name = "agro-sevooborot-backend"
version = "0.1.0"
description = "Агро-Севооборот: инструмент поддержки решений по севообороту для Северного Казахстана"
requires-python = ">=3.11"
# Диапазоны проверены тестами на обоих концах: нижние границы (numpy 1.26 / pandas 2.2.2 / scipy 1.13 /
# matplotlib 3.9 / shapely 2.0.4 …) и новейшие версии (numpy 2.4 / pandas 3.1 / scipy 1.17 / matplotlib 3.11 …).
# Верхние границы — следующий мажорный выпуск, который ещё не проверялся.
# Точные версии для воспроизводимой сборки Docker — в constraints.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    # pandas < 2.2.2 и shapely < 2.0.4 собраны под NumPy 1.x и не импортируются с NumPy 2
    # («numpy.dtype size changed»), хотя в метаданных не запрещают его: отсекаем их явно.
    "pandas>=2.2.2,<4",
    "shapely>=2.0.4,<3",
    "scipy>=1.13,<2",
    "reportlab>=4.2,<6",
    "matplotlib>=3.9,<4",
    # Сертификат modis.ornl.gov выпущен в цепочке emSign Root CA - G1;
    # более старые наборы корневых сертификатов certifi его не содержат.
    # Без верхней границы: набор корневых сертификатов должен обновляться.
    "certifi>=2026.10.23",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
# Авторизация NASA Earthdata по логину/паролю (SMAP, GPM). С токеном EARTHDATA_TOKEN не требуется.
earthdata = ["earthaccess>=0.11,<1"]
dev = ["pytest>=8,<10", "pypdf>=4,<8", "ruff>=0.5,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rules/*.yaml", "locales/*.yaml", "assets/fonts/*", "data_sources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023", "B008", "B905", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"../scripts/*" = ["E402"]

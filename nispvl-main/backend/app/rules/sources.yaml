# ---------------------------------------------------------------- «Часы голой почвы» (rules/erosion.yaml)
# Поле note у источника: как он проверен. «Проверено только по выдержке, полный текст не прочитан» —
# значит, цифра сверена по фрагменту текста из поисковой выдачи (полные тексты в контейнере хакатона
# были недоступны). Список для сверки по полному тексту — docs/HACKATHON_LOG.md, «To verify on full text».

rweq_1998:
  name: "Fryrear D.W., Saleh A., Bilbro J.D., Schomberg H.M., Stout J.E., Zobeck T.M. Revised Wind Erosion Equation (RWEQ). Technical Bulletin No. 1. USDA-ARS, Southern Plains Area Cropping Systems Research Laboratory, Wind Erosion and Water Conservation Research Unit, 1998: пороговая скорость эрозионного ветра 5 м/с на высоте 2 м; снежный покров глубже 25,4 мм защищает почву"
  url: "https://www.soilerosion.net/old/sen/doc/report_6/RWEQmod.htm"
  note: "Проверено только по выдержке, полный текст не прочитан. Порог 5 м/с на 2 м — по вторичным источникам (например, Frontiers in Environmental Science, 2022, doi:10.3389/fenvs.2022.847128: «RWEQ assumes a value of 5 m/s at a height of 2 m as the threshold»), порог снега 25,4 мм — по выдержке из описания RWEQ"

chepil_1956:
  name: "Chepil W.S. Influence of moisture on erodibility of soil by wind. Soil Science Society of America Proceedings 20:288–292, 1956: влага до ~1/3 влажности при 15 атм (завядание) почти не влияет на эродируемость, при влажности завядания эродируемость в среднем падает до нуля"
  url: "https://doi.org/10.2136/sssaj1956.03615995002000020033x"
  note: "Проверено только по выдержке, полный текст не прочитан (аннотация и пересказ Skidmore & Layton)"

fecan_1999:

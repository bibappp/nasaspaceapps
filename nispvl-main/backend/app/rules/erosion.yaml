# Поле evidence — класс обоснованности (аудит модели, docs/MODEL_AUDIT.md):
#   literature — значение или диапазон есть в научном/официальном источнике (сверено с текстом);
#   agronomist_review — косвенная опора (другой регион, аналог, один год, расчёт), нужна проверка агрономом;
#   preliminary — предварительное допущение без источника или параметр конструкции модели;
#   definition — определение, тривиальное значение или величина, рассчитанная из данных.
# status: verified ставится только при literature/definition, если значение применимо к Северному Казахстану.
#
# Пороги «Часов голой почвы» (GET /api/fields/{id}/bare-soil, docs/contracts/README.md).
# День «опасен», если в один и тот же день: нет зелёного покрова (открытая почва или стерня),
# дует эрозионный ветер и верхний слой почвы сухой. Снежные дни не оцениваются.
#
# Формат значений тот же, что в crops.yaml и model.yaml. Дополнительно у правила может быть
#   range: [нижняя, верхняя] — диапазон из литературы; загрузчик проверяет, что value внутри него.
# Ни один источник ниже не сверен по полному тексту (в контейнере хакатона полные тексты были недоступны),
# поэтому литературные пороги помечены status: assumption. Список для сверки — docs/HACKATHON_LOG.md.

# Соответствие id порогов в ответе API (поле thresholds) и правил этого файла.
contract_thresholds:
  ndvi_bare: bare_soil.ndvi_max
  erosive_wind_ms: erosive_wind.speed_ms
  dry_topsoil: dry_topsoil.smap_wilting_point_factor

# ---------------------------------------------------------------- нет зелёного покрова
bare_soil:
  # Класс — «нет зелёного покрова (открытая почва или стерня)», а не «голая почва»: NDVI не отличает
  # пожнивные остатки от почвы (daughtry_residue). Поэтому доля опасных дней — верхняя оценка риска:
  # если стерня оставлена стоять, потери почвы намного меньше (bilbro_fryrear_1994).
  ndvi_max:
    {value: 0.30, range: [0.20, 0.30], unit: "NDVI (MOD13Q1, пиксель 250 м)", source: lamb_2022, status: assumption, evidence: agronomist_review,
     note: "Пиксель без зелёного покрова, если NDVI < 0,30. Литература: < 0,20 — открытая почва на Landsat (Sobrino et al., 2004), < 0,25 — открытая почва на Sentinel-2 в Бельгии (Dvorakova et al., 2021), < 0,30 — сцены без заметной зелени для оценки пожнивных остатков (Lamb et al., 2022); проверено только по выдержке, полный текст не прочитан. Взята верхняя граница по проверке на демо-полях (Шортанды, Костанай; MOD13Q1, 2021–2026, начало мая до сева и конец сентября после уборки): медиана NDVI по полю 0,22–0,37; ниже 0,20 — не больше 2 % пикселей ни в одном композите; ниже 0,25 у Шортанды ни в одном композите не набирается половины пикселей; ниже 0,30 у Костаная в большинстве таких композитов 83–100 % пикселей, у Шортанды в 2021–2023 гг. 15–58 % (в 2024–2026 гг. NDVI в мае 0,5–0,6 — вероятно, другая культура на поле, не проверено). Вероятные причины высокого NDVI без зелени (не проверены): композит 16 дней берёт максимум NDVI, пиксель 250 м смешивает края поля, сорняки и стерню. Калибровка сделана на тех же демо-полях, на которых модель показывается, — это не независимая проверка. При 0,30 в класс могут попасть и редкие всходы. TODO агроному: сверить даты композитов с журналом поля (открыто / стерня / всходы)"}
  # Значения порога, для которых make audit показывает результат «Часов» (чувствительность).
  sensitivity_values: [0.25, 0.30]
  min_field_fraction:
    {value: 0.5, unit: "доля пикселей поля", source: model_design, status: assumption, evidence: preliminary,
     note: "День считается днём без зелёного покрова, если ниже порога NDVI не меньше половины годных пикселей поля (pixel_reliability 0–1) в композите, который покрывает этот день"}

# ---------------------------------------------------------------- эрозионный ветер
erosive_wind:
  reference_height_m: 2
  power_parameter: WS2M_MAX   # максимальная часовая скорость ветра за сутки на 2 м (power_parameters)
  speed_ms:
    {value: 5.0, unit: "м/с на высоте 2 м (POWER WS2M_MAX)", source: rweq_1998, status: assumption, evidence: agronomist_review,
     note: "День с эрозионным ветром, если максимальная часовая скорость ветра на 2 м не меньше 5 м/с — порог RWEQ (Fryrear et al., 1998); проверено только по выдержке, полный текст не прочитан. RWEQ принимает 5 м/с как постоянную для всех почв и регионов, не как измеренный порог для поля. Суточное среднее WS2M не используется: порог относится к порывам и часовым скоростям, а среднее за сутки ≥ 5 м/с бывает лишь в 1–31 % дней (Шортанды, 2015–2024). Для сравнения со станциями (флюгер 10–15 м): в POWER у Шортанды WS10M_MAX / WS2M_MAX ≈ 1,36, то есть 5 м/с на 2 м ≈ 6,8 м/с на 10 м. Вторичный источник (ru-ecology.info, со ссылкой на А. А. Зайцеву; первоисточник не установлен) даёт для Северного Казахстана дефляционно опасные скорости на высоте флюгера 6 м/с для лёгких почв и 10 м/с и более для тяжёлых — с RWEQ согласуется для лёгких почв. Чувствительность большая: WS10M_MAX ≥ 6 м/с — 44–72 % дней по месяцам, ≥ 10 м/с — 3–21 %. Реанализ (ячейка ~50 км) сглаживает местные порывы. TODO агроному: лёгкие или тяжёлые почвы на полях; первоисточник порога для южных чернозёмов"}
  # Справочно: диапазон дефляционно опасных скоростей на высоте флюгера ~10 м (лёгкие … тяжёлые почвы),
  # вторичный источник, см. note выше. В расчёте не используется.
  context_range_10m_ms: [6, 10]

# ---------------------------------------------------------------- сухой верхний слой
dry_topsoil:
  smap_wilting_point_factor:
    {value: 1.0, range: [0.33, 1.0], unit: "× влажность завядания слоя 0–5 см (θ_wp, Saxton–Rawls по SoilGrids)", source: chepil_1956, status: assumption, evidence: agronomist_review,
     note: "День сухой, если влажность SMAP (м³/м³) ниже θ_wp поля. Chepil (1956): влага до ~1/3 влажности при 15 атм почти не влияет на эродируемость, при влажности завядания эродируемость в среднем падает до нуля (проверено только по выдержке, полный текст не прочитан); range — эти две границы. Берём верхнюю: «сухо» = почва ещё может выдуваться. Chepil измерял влагу поверхностных частиц (миллиметры), SMAP — слой 0–5 см, который влажнее поверхности, поэтому сухие дни скорее недосчитываются. На демо-полях θ_wp слоя 0–5 см = 0,199 (Шортанды) и 0,223 (Костанай) м³/м³. Для сверки: остаточная влажность по Fécan et al. (1999) при 25,6–31,9 % глины в слое 0–5 см демо-полей ≈ 5,3–6,9 % по массе (формула по вторичному источнику). TODO агроному: подходит ли «ниже влажности завядания» как «достаточно сухо, чтобы выдувалось» для этих почв"}
  smap_fallback_m3m3:
    {value: 0.20, unit: "м³/м³ (SMAP)", source: model_design, status: assumption, evidence: preliminary,
     note: "Порог сухости SMAP, если для поля нет данных SoilGrids: округлённая θ_wp слоя 0–5 см демо-полей (0,199 и 0,223)"}
  # GWETTOP (POWER, MERRA-2) — не та же величина, что SMAP: доля насыщения пор (0–1, безразмерная) в модели,
  # ячейка ~50 км, а не измеренная объёмная влажность (м³/м³) в ячейке 9 км. SFMC = пористость × GWETTOP
  # (gmao_merra2_faq). Пересчёт по пористости не работает: на демо-полях GWETTOP почти не опускается ниже
  # 0,45, и порог θ_wp / пористость ≈ 0,35–0,39 дал бы сухие дни лишь в 2,6–3,9 % дней, хотя SMAP ниже θ_wp
  # в 48–57 % дней апреля–мая. Поэтому порог GWETTOP подбирается для каждого поля так, чтобы доля сухих дней
  # совпала с SMAP на общих днях с 2015 г. (сопоставление распределений, reichle_koster_2004).
  gwettop_method: cdf_match
  gwettop_min_pairs:
    {value: 60, unit: "общих дней SMAP и GWETTOP", source: model_design, status: assumption, evidence: preliminary,
     note: "Минимум общих бесснежных дней SMAP и GWETTOP, чтобы подобрать порог GWETTOP для поля сопоставлением распределений (Reichle & Koster, 2004; проверено только по выдержке, полный текст не прочитан). Меньше — используется gwettop_fallback"}
  gwettop_fallback:
    {value: 0.70, range: [0.70, 0.79], unit: "доля насыщения GWETTOP (0–1)", source: model_design, status: assumption, evidence: preliminary,
     note: "Порог GWETTOP, если общих дней с SMAP мало (например, нет токена Earthdata). Получен на демо-полях сопоставлением распределений за апрель–май 2015–2026: Костанай 0,70, Шортанды 0,79; взято меньшее значение (меньше сухих дней). Только два поля и два месяца — значение предварительное"}
  # Месяцы, где сухость определялась по GWETTOP, получают quality: partial.
  gwettop_month_quality: partial

# ---------------------------------------------------------------- снег
snow:
  # День снежный, если снег видит MODIS (композит) или POWER (FRSNO и SNODP одновременно).
  # Температура (T2M) не используется: она не наблюдает снег, а мёрзлая почва не защищена от выдувания.
  modis_reliability_snow:
    {value: 2, unit: "код pixel_reliability MOD13Q1", source: mod13_user_guide, status: verified, evidence: definition,
     note: "Код 2 — снег/лёд. Сверено по каталогу Google Earth Engine и docstring modis.py; таблица в руководстве C6.1 не прочитана"}
  modis_min_field_fraction:
    {value: 0.5, unit: "доля пикселей поля", source: model_design, status: assumption, evidence: preliminary,
     note: "Композит снежный, если код 2 у не меньше половины пикселей поля; тогда снежными считаются все дни этого композита. Сезон (DOY 129–273) загружает источник modis, весну и осень (DOY 81–113, 289–305) — modis_shoulder; счётчики кодов качества сохраняются с задачи 4, в старых рядах их нет — тогда снег только по POWER"}
  power_frsno_min:
    {value: 0.5, unit: "доля ячейки под снегом (POWER FRSNO)", source: model_design, status: assumption, evidence: preliminary,
     note: "Снег покрывает больше половины ячейки. SNODP без FRSNO не годится: в MERRA-2 это высота снега в заснеженной части ячейки (gmao_merra2_faq), и у Шортанды SNODP ≥ 1 см в 61 % дней октября, хотя FRSNO ≥ 0,5 — в 0 % (2015–2024). TODO: сверить с метеорологическим определением дня со снежным покровом (Казгидромет)"}
  power_snodp_min_cm:
    {value: 2.54, unit: "см (POWER SNODP)", source: rweq_1998, status: assumption, evidence: agronomist_review,
     note: "Снег глубже 25,4 мм (1 дюйм) защищает почву — коэффициент снежного покрова RWEQ (проверено только по выдержке, полный текст не прочитан). В RWEQ это глубина по метеоданным, у нас — высота снега в заснеженной части ячейки MERRA-2, поэтому применяется вместе с FRSNO"}
  month_snow_day_fraction:
    {value: 0.5, unit: "доля дней месяца", source: model_design, status: assumption, evidence: preliminary,
     note: "Месяц получает state: snow, если снежных дней не меньше половины; в остальных месяцах снежные дни не считаются днями без покрова"}

# ---------------------------------------------------------------- суточный ряд NDVI (задача 4)
# Композит MOD13Q1 ставится в середину своего 16-дневного окна; внутри окна берётся его значение,
# между серединами двух годных композитов — линейная интерполяция. Через снег и длинные разрывы
# не интерполируем: такие дни «неизвестны» (не 0 и не «голая почва»).
ndvi_daily:
  min_valid_fraction:
    {value: 0.5, unit: "доля пикселей поля (pixel_reliability 0–1)", source: model_design, status: assumption, evidence: preliminary,
     note: "Композит годен для «Часов», если хороших пикселей не меньше половины поля — так же, как для тренда NDVI (model.yaml, ndvi_trend.min_valid_fraction)"}
  max_interp_gap_days:
    {value: 32, unit: "дней между серединами композитов", source: model_design, status: assumption, evidence: preliminary,
     note: "Интерполируем между годными композитами, если между их серединами не больше 32 дней, то есть пропущен (облака) не больше одного композита. При двух и более пропущенных композитах подряд дни между ними неизвестны"}

# ---------------------------------------------------------------- месяц
month:
  min_known_fraction:
    {value: 0.5, unit: "доля дней месяца", source: model_design, status: assumption, evidence: preliminary,
     note: "Месяц считается (state: ok), если известны все три условия (покров, ветер, сухость) не меньше чем в половине дней; иначе state: missing. exposure = joint_days / known_days, поэтому неизвестные дни не занижают долю; при known_days < days_in_month — quality: partial"}

# ---------------------------------------------------------------- многолетняя сводка
climatology:
  min_years:
    {value: 3, unit: "лет с посчитанным месяцем", source: model_design, status: assumption, evidence: preliminary,
     note: "Медиана и P90 exposure по месяцу показываются, если месяц посчитан (state: ok) хотя бы в 3 годах; иначе null"}

headline:
  top_n:
    {value: 3, unit: "месяцев", source: model_design, status: assumption, evidence: preliminary,
     note: "В headline.top_months — до трёх месяцев с наибольшей медианой exposure (только месяцы с медианой больше нуля)"}

# ---------------------------------------------------------------- окна покровных культур
# Окно — период после уборки основной культуры, когда медианная доля опасных дней высокая и до первого
# осеннего заморозка остаётся достаточно дней, чтобы покровная культура успела взойти и закрыть почву.
# Окно никогда не начинается раньше harvest_end области: от сева до уборки поле занято основной культурой.
# Даты заморозков — медианы по годам из POWER T2M_MIN (ячейка ~50 км, воздух на 2 м).
cover_crop:
  # Последний весенний заморозок ищется до конца этого месяца, первый осенний — после него (номер месяца).
  season_split_month: 7
  min_median_exposure:
    {value: 0.10, unit: "медиана exposure месяца", source: model_design, status: assumption, evidence: preliminary,
     note: "Месяц кандидат в окно покровной культуры, если медиана доли опасных дней не меньше 0,10 (≈ 3 дня в месяц). Значение не откалибровано. TODO агроному"}
  frost_t2m_min_c:
    {value: 0.0, unit: "°C (POWER T2M_MIN)", source: etccdi_indices, status: assumption, evidence: definition,
     note: "День с заморозком, если минимальная температура воздуха ниже 0 °C — определение индекса FD (frost days) ETCCDI. В POWER это воздух на 2 м в ячейке ~50 км; заморозок на поверхности почвы бывает и при T2M_MIN выше 0"}
  min_frost_free_days:
    {value: 30, unit: "дней до медианной даты первого осеннего заморозка", source: model_design, status: assumption, evidence: preliminary,
     note: "Окно показывается, если от его начала до медианы первого осеннего заморозка не меньше 30 дней — предварительно, чтобы культура успела взойти. Отсчёт идёт от начала окна, а окно начинается не раньше harvest_end, то есть это дни после уборки. Источник для Северного Казахстана не найден. TODO агроному: какие покровные культуры и сроки сева реалистичны после уборки"}
  # Типичное окончание уборки основной культуры (зерновые) по области, «ММ-ДД». Окно покровной культуры
  # начинается не раньше этой даты. Ключи — id областей из regions.yaml (загрузчик проверяет, что заданы все).
  harvest_end:
    akmola:
      {value: "10-01", unit: "ММ-ДД (типичное окончание уборки зерновых в области)", source: kz_harvest_reports, status: assumption, evidence: agronomist_review,
       note: "Рекомендации НПЦ им. Бараева или МСХ со сроками уборки не найдены. По новостям: уборка в области завершена 26.10.2025 (zakon.kz; рекордный и поздний год). 01.10 — ранняя (мягкая) граница: отдельное поле убирают раньше, чем область целиком, но в поздние годы на части полей уборка идёт ещё 2–4 недели. TODO агроному: типичная дата окончания уборки на поле по журналам хозяйств за 5–10 лет; нужна ли дата для каждой культуры (рапс, лён, подсолнечник убирают позже пшеницы)"}
    kostanay:
      {value: "10-01", unit: "ММ-ДД (типичное окончание уборки зерновых в области)", source: kz_harvest_reports, status: assumption, evidence: agronomist_review,
       note: "Рекомендации со сроками уборки не найдены. По новостям: уборка зерновых и зернобобовых в области завершена к 07.10.2022 (caravan.kz), 16.10.2025 убрано 95,1 % площади (inbusiness.kz). 01.10 — ранняя (мягкая) граница, как для Акмолинской области. TODO агроному: то же, что для akmola"}
    north_kazakhstan:
      {value: "10-01", unit: "ММ-ДД (типичное окончание уборки зерновых в области)", source: model_design, status: assumption, evidence: preliminary,
       note: "Принято как для Акмолинской и Костанайской областей; сводки по уборке в СКО не проверялись. TODO агроному: проверить по журналам хозяйств"}
  # Если окна нет, cover_crop_note.advice — общая рекомендация (не для конкретного поля): оставить стоящую стерню,
  # не пахать осенью. Источник — id из sources.yaml; его статус проверки показывается как есть (source.note).
  no_window_advice_source: bilbro_fryrear_1994
  min_years_medium_uncertainty:
    {value: 5, unit: "лет", source: model_design, status: assumption, evidence: preliminary,
     note: "Меньше 5 посчитанных лет в месяцах окна — неопределённость high"}
  min_years_low_uncertainty:
    {value: 10, unit: "лет", source: model_design, status: assumption, evidence: preliminary,
     note: "Не меньше 10 лет и не больше половины месяцев с quality: partial — неопределённость low; иначе medium"}
  max_partial_share_low_uncertainty:
    {value: 0.5, unit: "доля месяцев окна с quality: partial", source: model_design, status: assumption, evidence: preliminary,
     note: "Если в месяцах окна больше половины месяцев посчитаны частично (GWETTOP, NDVI по среднему, неизвестные дни), неопределённость не ниже medium"}

# ---------------------------------------------------------------- планировщик: дни без покрова в сценариях
# Для каждого года сценария: дни без зелёного покрова = дни бесснежного сезона вне периода покрова культуры
# (окна сева и уборки — crops.yaml), у пара — весь бесснежный сезон (crops.fallow.bare_whole_season).
# Опасность = те же ветер и сухость, что в «Часах» (erosive_wind, dry_topsoil, snow), по многолетней
# климатологии поля; NDVI не используется — покров задаёт календарь культуры. В балл почвы не входит
# (docs/MODEL_AUDIT.md, § 7). Бесснежный сезон — медианы дат последнего весеннего и первого осеннего снежного дня
# (правила snow), граница весны и осени — cover_crop.season_split_month.
planner:
  canopy_start:
    {value: sowing_end, unit: "граница окна сева: sowing_start | sowing_mid | sowing_end", source: model_design, status: assumption, evidence: preliminary,
     note: "Покров начинается в конце окна сева: почва без покрова и до сева, и от сева до всходов, а отдельного числа «дней до всходов» без источника не вводим. Чувствительность к началу и середине окна — make audit (docs/MODEL_AUDIT.md, § 7)"}
  canopy_end:
    {value: harvest_mid, unit: "граница окна уборки: harvest_start | harvest_mid | harvest_end", source: model_design, status: assumption, evidence: preliminary,
     note: "Покров кончается в середине окна уборки — типичная дата уборки поля. После уборки стерня считается «без зелёного покрова», как в «Часах» (верхняя оценка, если стерня стоит). Чувствительность — make audit"}
  # Варианты границ, для которых make audit показывает результат (чувствительность).
  sensitivity_canopy_start: [sowing_start, sowing_mid, sowing_end]
  sensitivity_canopy_end: [harvest_start, harvest_mid, harvest_end]

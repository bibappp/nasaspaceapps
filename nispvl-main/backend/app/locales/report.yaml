stress_method: {ru: "В каждом сценарии год, в который засуха обошлась бы дороже всего, заменён условиями засушливого года. Урожайность культур снижается по коэффициенту Ky (FAO-33).", kk: "Әр сценарийде құрғақшылық ең қымбатқа түсетін жыл құрғақшылық жылдың жағдайымен ауыстырылды. Дақылдардың өнімділігі Ky коэффициенті бойынша төмендейді (FAO-33).", en: "In each scenario the year in which a drought would cost the most is replaced by the dry-year conditions. Crop yields are reduced by the Ky coefficient (FAO-33)."}

# ---------------------------------------------------------------- дни без покрова в сценариях (задача 5)
col_bare_days: {ru: "Дней без покрова в год", kk: "Жылына жамылғысыз күндер", en: "Bare days per year"}
col_exposure: {ru: "Индекс опасности эрозии (0–1)", kk: "Эрозия қауіпі индексі (0–1)", en: "Erosion exposure index (0–1)"}
bare_note: {ru: "Дни без покрова — дни бесснежного сезона поля ({start}–{end}, {days} дн., медиана за {n} лет) вне периода покрова культуры: с конца окна сева до середины окна уборки (параметр конструкции модели, assumption). После уборки стерня считается «без зелёного покрова», поэтому это верхняя оценка. Индекс опасности эрозии — доля дней сезона, когда одновременно нет покрова, ветер не слабее {wind} м/с на 2 м (POWER WS2M_MAX) и сухой верхний слой (SMAP, иначе GWETTOP); пороги те же, что у «Часов голой почвы» (assumption). В балл и рейтинг не входит. Окна сева и уборки: {windows}.", kk: "Жамылғысыз күндер — алқаптың қарсыз маусымындағы ({start}–{end}, {days} күн, {n} жылдың медианасы) дақыл жамылғысы кезеңінен тыс күндер: себу терезесінің соңынан жинау терезесінің ортасына дейін (модель құрылымының параметрі, assumption). Жинаудан кейін аңыз «жасыл жамылғысыз» саналады, сондықтан бұл жоғарғы баға. Эрозия қауіпі индексі — маусым күндерінің үлесі: бір мезгілде жамылғы жоқ, 2 м биіктікте жел {wind} м/с-тан әлсіз емес (POWER WS2M_MAX) және беткі қабат құрғақ (SMAP, болмаса GWETTOP); шектер «Жалаңаш топырақ сағаттарындағыдай» (assumption). Балл мен рейтингке кірмейді. Себу және жинау терезелері: {windows}. (ана тілінде тексеру қажет)", en: "Bare days are days of the field's snow-free season ({start}–{end}, {days} days, median of {n} years) outside the crop's canopy period: from the end of the sowing window to the middle of the harvest window (model design parameter, assumption). Stubble after harvest counts as no green cover, so this is an upper estimate. The erosion exposure index is the share of season days with no cover, wind of at least {wind} m/s at 2 m (POWER WS2M_MAX) and dry topsoil (SMAP, else GWETTOP) on the same day; thresholds as in the Bare Soil Clock (assumption). Not included in the score or ranking. Sowing and harvest windows: {windows}."}
bare_missing: {ru: "Дни без покрова не посчитаны: нет климатологии ветра, сухости и снега поля ({reason}).", kk: "Жамылғысыз күндер есептелмеді: алқаптың жел, құрғақшылық және қар климатологиясы жоқ ({reason}). (ана тілінде тексеру қажет)", en: "Bare days not computed: no wind, dryness and snow climatology for the field ({reason})."}

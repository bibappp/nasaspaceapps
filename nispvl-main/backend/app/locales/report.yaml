# --- ограничения
limitations:
  ru:
    - "Урожайность и затраты альтернативных культур — допущения; при урожайности на 20 % и затратах на 30 % хуже принятых монокультура пшеницы может оказаться доходнее."
    - "Эффекты предшественников взяты из опытов в Канаде и зависят от азотного питания; удобрения в модели не учитываются."
    - "Горизонт 3–5 лет обрезает пользу пара и бобовой культуры в последнем году плана."
    - "Осадки — реанализ с ячейкой ~50 км, влажность почвы SMAP — ячейка 9 км: локальные ливни и неоднородность поля не видны."
    - "Цены и затраты постоянны на весь план; рыночные колебания показаны только сценариями ±20 %."
    - "NDVI — зелёная масса, а не урожай; модель не откалибрована по фактическим урожаям поля."
  kk:
    - "Балама дақылдардың өнімділігі мен шығындары — болжамдар; өнімділік 20 %-ға және шығындар 30 %-ға нашар болса, бидай монокультурасы табыстырақ болуы мүмкін."
    - "Алғы дақыл әсерлері Канададағы тәжірибелерден алынған және азотпен қоректенуге тәуелді; модельде тыңайтқыштар ескерілмейді."
    - "3–5 жылдық көкжиек жоспардың соңғы жылындағы пар мен бұршақ дақылының пайдасын қысқартады."
    - "Жауын-шашын — ~50 км ұяшықты реанализ, SMAP топырақ ылғалдылығы — 9 км ұяшық: жергілікті нөсер мен егістіктің біркелкі еместігі көрінбейді."
    - "Бағалар мен шығындар бүкіл жоспарға тұрақты; нарық ауытқулары тек ±20 % сценарийлерімен көрсетілген."
    - "NDVI — өнім емес, жасыл масса; модель егістіктің нақты өнімі бойынша калибрленбеген."
  en:
    - "Yields and costs of alternative crops are assumptions; if yields are 20 % lower and costs 30 % higher than assumed, continuous wheat may earn more."
    - "Predecessor effects come from Canadian trials and depend on nitrogen supply; fertiliser is not modelled."
    - "The 3–5 year horizon truncates the benefit of fallow or a legume in the last plan year."
    - "Rainfall is a ~50 km reanalysis cell and SMAP soil moisture a 9 km cell: local showers and within-field variability are not visible."
    - "Prices and costs are constant over the plan; market swings are shown only as ±20 % scenarios."
    - "NDVI is green biomass, not yield; the model is not calibrated against actual field yields."

